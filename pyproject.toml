[project]
name = "rsys"
version = "0.0.1"
description = "Intraday strategy research system"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pyyaml",
    "pyarrow",
    "tzdata",
]

[project.scripts]
rsys = "rsys.cli:main"

# Kept outside core per AGENTS.md: "Keep Kronos/Nautilus/model extras out of the core installation."
[project.optional-dependencies]
kronos = ["torch"]
nautilus = ["nautilus_trader"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not alpaca_integration'"
markers = ["alpaca_integration: explicitly enabled, owner-configured real historical data sample"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsys"]
